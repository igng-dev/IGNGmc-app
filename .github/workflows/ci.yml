name: CI

# 2026-09-27 首版失败的修复：runner 镜像自带 Android SDK，原先额外调用的
# android-actions/setup-android@v3 会去安装已被 Google 下架的 tools 包而崩溃，故删除该步骤。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 剔除机器专属 SDK 路径（local.properties 不该进仓库）
        run: |
          cd "android"
          if [ -f local.properties ] && git ls-files --error-unmatch local.properties >/dev/null 2>&1; then
            echo "::warning file=local.properties::local.properties 被提交进仓库，CI 已临时删除；请把它加入 .gitignore"
            rm -f local.properties
          fi
      - name: 构建 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 单元测试
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.event.number || github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
